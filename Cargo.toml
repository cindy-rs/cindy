[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]
# The marketing site is its own nested workspace: it shares no crates
# with the framework (the coupling is editorial — docs and snippets),
# and keeping its dioxus tree out of this lockfile keeps framework
# builds, `cargo install --path` and audits lean. The e2e-cli fixture
# playbook is nested for the opposite reason: `cindy play` must resolve
# *it* — a standalone user playbook — not the framework workspace the
# suite lives in.
exclude = ["web", "examples/e2e-cli/fixture"]

[workspace.package]
description = "Managing infrastructure at breakneck speed."
authors = ["Martin Kröner <crates.io@kroner.dev>"]
version = "0.3.0"
rust-version = "1.98.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/cindy-rs/cindy"
homepage = "https://cindy.rs"
keywords = ["ansible", "infrastructure", "iac", "management", "provisioning"]

[workspace.dependencies]
cindy = { path = "crates/cindy", version = "0.3.0" }
# Exact: the macros' expansions name cindy's internals (`__reexports`,
# `entry`, `error::wire`), so a cindy-macros newer than cindy can emit
# paths that cindy doesn't have.
cindy-macros = { path = "crates/cindy-macros", version = "=0.3.0" }

base64 = "0.22"
postcard = "1.1"
proc-macro2 = "1.0"
proc-macro-crate = "3"
serde = "1.0"
flate2 = { version = "1.1.9", default-features = false, features = [
    "rust_backend",
] }
serde_json = "1.0"
sha2 = "0.11"
syn = "2.0"
tempfile = "3.27"
tokio = "1.52"
