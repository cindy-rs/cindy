[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
description = "Managing infrastructure at breakneck speed."
authors = ["Martin Kröner <crates.io@kroner.dev>"]
version = "0.3.0"
rust-version = "1.98.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/cindy-rs/cindy"
homepage = "https://cindy.rs"
keywords = ["ansible", "infrastructure", "iac", "management", "provisioning"]

[workspace.dependencies]
cindy = { path = "crates/cindy", version = "0.3.0" }
cindy-macros = { path = "crates/cindy-macros", version = "0.3.0" }

postcard = "1.1"
proc-macro2 = "1.0"
proc-macro-crate = "3"
serde = "1.0"
serde_json = "1.0"
syn = "2.0"
tokio = "1.52"
