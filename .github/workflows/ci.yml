# A GitHub-hosted ubuntu runner is a VM with a Docker daemon at
# /var/run/docker.sock, so the container e2e suite (testcontainers +
# bollard, no CLI) needs no setup and no docker-in-docker. Don't add
# `container:` to a job: that puts it inside a container, without the
# socket. macOS and Windows runners have no Linux daemon.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI without needing `-D warnings` on every call.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nightly: tier-3 worker builds need -Zbuild-std.
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rustfmt,clippy
          rustup default nightly
          rustup component add rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      # A nested workspace the root fmt doesn't reach.
      - name: Format fixture playbook
        run: cargo fmt --check --manifest-path examples/e2e-cli/fixture/Cargo.toml

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Together the same as `cargo test --workspace`; the container
      # suite runs on its own so its output can prove it didn't skip.
      - name: Test
        run: cargo test --workspace --exclude e2e-containers

      - name: Container e2e (must run, not skip)
        run: |
          set -o pipefail
          cargo test -p e2e-containers -- --nocapture 2>&1 | tee out.txt
          if grep -q "skipping container e2e" out.txt; then
            echo "::error::container e2e skipped; it must run in CI"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # The site's nested workspace has its own lockfile.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit web lockfile
        run: cargo audit --file web/Cargo.lock

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly with wasm
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup default nightly
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web

      - name: Format
        run: cargo fmt --check --manifest-path web/Cargo.toml

      # `dx` generates assets/tailwind.css; cargo only needs it to exist.
      - name: Check (wasm)
        run: |
          cp web/tailwind.css web/assets/tailwind.css
          cargo check --manifest-path web/Cargo.toml \
            --target wasm32-unknown-unknown
