# CI for github.com/cindy-rs/cindy.
#
# No docker-in-docker anywhere, and none needed: a GitHub-hosted
# `ubuntu-*` runner is a **virtual machine** with a real Docker daemon
# already running, not a container. `/var/run/docker.sock` is there, so
# testcontainers — and therefore examples/e2e-containers — works with
# no service, no privileged mode and no DOCKER_HOST. (dind is the
# pattern for runners that execute jobs *inside* containers; there is
# nothing to nest here.)
#
# Two consequences worth knowing:
#   * `container:` on a job would put us back inside a container, and
#     the socket would then need mounting. Don't, unless you must.
#   * macOS and Windows runners have no usable Linux Docker daemon, so
#     the container suite is ubuntu-only.
#
# The harness needs no container CLI at all — it speaks the Docker API
# directly (bollard) — so there is nothing to install and no
# podman-vs-docker choice to configure.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same ref makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI without needing `-D warnings` on every call.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nightly: cindy's MSRV is 1.98 but tier-3 worker builds need
      # -Zbuild-std, and rustfmt/clippy come from the same toolchain.
      - name: Install Rust nightly
        run: |
          rustup toolchain install nightly --profile minimal \
            --component rustfmt,clippy
          rustup default nightly
          rustup component add rust-src

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo test --workspace` includes examples/e2e-containers, which
      # uses the runner's Docker daemon over /var/run/docker.sock. No
      # setup and no engine choice to make: the harness talks the Docker
      # API through bollard, so podman-vs-docker never comes up.
      - name: Test
        run: cargo test --workspace

      # Proves the container suite actually ran rather than skipping.
      # It fails by default when no engine is present, so a green Test
      # step already implies it ran — this makes that explicit and
      # would catch a future default flipping back to skip.
      - name: Container e2e ran (not skipped)
        run: |
          cargo test -p e2e-containers -- --nocapture 2>&1 | tee out.txt
          if grep -q "skipping container e2e" out.txt; then
            echo "::error::container e2e skipped; it must run in CI"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # The site is a nested workspace with its own lockfile; the
      # action above only audits the root one.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit web lockfile
        run: cargo audit --file web/Cargo.lock

  web:
    # The marketing site is a nested workspace; the root commands don't
    # reach it, so it gets its own job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly with wasm
        run: |
          rustup toolchain install nightly --profile minimal --component rustfmt
          rustup default nightly
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web

      - name: Format
        run: cargo fmt --check --manifest-path web/Cargo.toml

      # `dx` compiles tailwind.css into assets/; raw cargo only needs
      # the file to exist — its content doesn't affect compilation.
      - name: Check (wasm)
        run: |
          cp web/tailwind.css web/assets/tailwind.css
          cargo check --manifest-path web/Cargo.toml \
            --target wasm32-unknown-unknown
