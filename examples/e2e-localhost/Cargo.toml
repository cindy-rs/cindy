[package]
name = "e2e-localhost"
description = "End-to-end localhost example/test exercising cindy's builtin modules with no SSH and no system mutation."
publish = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "e2e-localhost"
path = "src/main.rs"

[features]
# The CLI builds each half with exactly one; both by default makes
# `cargo check` and rust-analyzer analyse the whole program.
default = ["orchestrator", "remote"]
orchestrator = ["cindy/orchestrator", "dep:futures-util"]
remote = ["cindy/remote"]
# A `secret!` vault demand in the worker, for the keyless-handshake
# test only. A feature, not an env var: the registration is link-time.
worker-vault-demand = []

[dependencies]
cindy = { workspace = true }
futures-util = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
postcard = { workspace = true, features = ["alloc"] }
uuid = { workspace = true, features = ["serde"] }
serde_json = { workspace = true }
tempfile.workspace = true
sha2 = "0.11"
# The tests seal real ciphertexts, as `cindy secret seal` does.
cindy = { workspace = true }
