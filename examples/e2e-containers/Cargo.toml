[package]
name = "e2e-containers"
description = "End-to-end test of the mutating builtins (systemd, apt, user, group) against a real Debian-systemd container."
publish = false
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "e2e-containers"
path = "src/main.rs"

[features]
# As examples/e2e-localhost: the harness builds each half and pipes them
# together, with the worker inside the container.
default = ["orchestrator", "remote"]
orchestrator = ["cindy/orchestrator", "dep:futures-util"]
remote = ["cindy/remote"]

[dependencies]
cindy = { workspace = true }
futures-util = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile.workspace = true
testcontainers = "0.28"
# The same version testcontainers 0.28 already depends on, so this adds
# no new tree — only direct access to the exec-with-stdin it doesn't
# expose.
bollard = "0.21"
futures-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
